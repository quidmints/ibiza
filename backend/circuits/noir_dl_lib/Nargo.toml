[package]
name = "lib"
type = "lib"
path = "src/lib.rs"
authors = [""]

# (caught by actually running `nargo test`, not by inspection): sort v0.4.0's `lib.nr` uses a
# changelog literally says "update noir version," and it fails the same way. Both need a newer
# nargo than our pinned beta.1 - staying on the versions confirmed to actually work (v0.2.0/v0.0.2)
# until nargo itself is bumped (see pp/Nargo.toml's matching note; tracked under P0-remaining).
[dependencies]
sort = {tag = "v0.3.0", git = "https://github.com/noir-lang/noir_sort"}
# PoseidonHasher moved out of the Noir stdlib; pinned to the same version pp uses so the
# hash stays identical across every circuit in this workspace.
poseidon = { tag = "v0.2.0", git = "https://github.com/noir-lang/poseidon" }
# sha256 left the Noir stdlib; used only by this library's own #[test] vectors.
sha256 = { tag = "v0.2.0", git = "https://github.com/noir-lang/sha256" }
