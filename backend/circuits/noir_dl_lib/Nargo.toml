[package]
name = "lib"
type = "lib"
path = "src/lib.rs"
authors = [""]

# DEPENDENCY FRESHNESS PASS (2026-07-25): sort v0.4.0 and ripemd160 v0.0.4 were tried and REVERTED
# (caught by actually running `nargo test`, not by inspection): sort v0.4.0's `lib.nr` uses a
# leading-`::` absolute-path `use` statement nargo 1.0.0-beta.1 can't parse; ripemd160 v0.0.4's own
# changelog literally says "update noir version," and it fails the same way. Both need a newer
# nargo than our pinned beta.1 - staying on the versions confirmed to actually work (v0.2.0/v0.0.2)
# until nargo itself is bumped (see pp/Nargo.toml's matching note; tracked under P0-remaining).
[dependencies]
sort = {tag = "v0.2.0", git = "https://github.com/noir-lang/noir_sort"}
ripemd160 = { tag = "v0.0.2", git = "https://github.com/distributed-lab/noir-ripemd160" }